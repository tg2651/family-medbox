<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>家庭用药 · 成员端</title>
<style>
:root{--p:#2563eb;--bg:#f1f5f9;--card:#fff;--txt:#0f172a;--sub:#64748b;--ok:#16a34a;--warn:#d97706;--bad:#dc2626}
*{box-sizing:border-box;margin:0}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt)}
.box{max-width:480px;margin:8vh auto;padding:0 16px}
.card{background:var(--card);border-radius:14px;padding:24px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
h1{font-size:19px;margin-bottom:18px;text-align:center}
input,select,button{font:inherit;width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px;margin-bottom:10px}
button{background:var(--p);color:#fff;border:none;cursor:pointer}
.err{color:var(--bad);font-size:13px;margin-bottom:8px;display:none}
.tabbar{display:flex;gap:8px;margin-bottom:14px}
.tabbar button{background:#e2e8f0;color:var(--txt);width:auto;padding:8px 18px;border-radius:20px}
.tabbar button.act{background:var(--p);color:#fff}
.item{border-top:1px dashed #e2e8f0;padding:10px 0;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.it-t{font-weight:600;font-size:18px;color:var(--p);width:56px}
.mname{font-weight:600}
.sub{color:var(--sub);font-size:12px}
.pill{padding:5px 14px;border-radius:16px;font-size:13px;width:auto;margin:0}
.pill.taken{background:#dcfce7;color:var(--ok)}
.pill.pending{background:#fef3c7;color:var(--warn)}
.pill.skip{background:#e2e8f0;color:var(--sub)}
.med{border:1px solid #e2e8f0;border-radius:10px;padding:12px;margin-bottom:10px}
.med .t{font-weight:600}
.warn{color:var(--warn);font-size:13px}
.bad{color:var(--bad);font-size:13px}
.row{display:flex;gap:8px}
.row>*{flex:1}
a{color:var(--p)}
</style>
</head>
<body>
<div class="box">
<div class="card" id="login">
  <h1>家庭用药 · 成员端</h1>
  <div class="err" id="lerr"></div>
  <input id="lu" placeholder="用户名">
  <input id="lp" type="password" placeholder="密码">
  <button onclick="doLogin()">登录</button>
  <div class="sub">没有账号？<a href="#" onclick="showReg();return false;">注册新成员</a>（首次创建家庭即管理员；加入已有家庭需邀请码）<br>管理员请用 <a href="/admin.html">管理后台</a></div>
</div>
<div class="card" id="reg" style="display:none">
  <h1>注册家庭成员</h1>
  <div class="err" id="rerr"></div>
  <input id="ru" placeholder="用户名（登录用）">
  <input id="rp" type="password" placeholder="密码">
  <input id="rn" placeholder="姓名/称呼">
  <input id="ra" type="number" placeholder="年龄（选填）">
  <input id="rc" placeholder="邀请码（加入已有家庭；留空=新建家庭）">
  <button onclick="doReg()">注册</button>
  <div class="sub"><a href="#" onclick="showLogin();return false;">返回登录</a></div>
</div>
<div id="app" style="display:none">
  <div class="tabbar">
    <button class="act" onclick="tab(0,this)">今日</button>
    <button onclick="tab(1,this)">我的药品</button>
    <button onclick="tab(2,this)">开药提醒</button>
  </div>
  <div id="tab0"></div>
  <div id="tab1" style="display:none"></div>
  <div id="tab2" style="display:none"></div>
</div>
</div>
<script>
let T=localStorage.getItem('token')||'',me=null;
const $=id=>document.getElementById(id);
const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(p,opt={}){const r=await fetch('/api'+p,{...opt,headers:{'Content-Type':'application/json',Authorization:'Bearer '+T,...(opt.headers||{})}});if(r.status===401){T='';localStorage.removeItem('token');location.reload();}const j=await r.json();if(!r.ok)throw new Error(j.error);return j;}
function showReg(){$('login').style.display='none';$('reg').style.display='';}
function showLogin(){$('reg').style.display='none';$('login').style.display='';}
async function doLogin(){
  const j=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('lu').value,password:$('lp').value})}).then(r=>r.json());
  if(j.error){$('lerr').textContent=j.error;$('lerr').style.display='block';return;}
  T=j.token;localStorage.setItem('token',T);init();
}
async function doReg(){
  const b={username:$('ru').value,password:$('rp').value,display_name:$('rn').value};
  if($('ra').value)b.age=+$('ra').value;
  if($('rc').value)b.invite_code=$('rc').value;
  const j=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(r=>r.json());
  if(j.error){$('rerr').textContent=j.error;$('rerr').style.display='block';return;}
  T=j.token;localStorage.setItem('token',T);init();
}
async function init(){
  try{me=await api('/me');}catch(e){return;}
  $('login').style.display='none';$('reg').style.display='none';$('app').style.display='';
  renderToday();renderMeds();renderAlerts();
}
async function renderToday(){
  const items=await api('/today');
  $('tab0').innerHTML=`<div class="card"><h1 style="font-size:16px">今日服药（${me.user.display_name}）</h1>`+
  (items.length?items.map(i=>`<div class="item"><div><span class="it-t">${h(i.plan_time)}</span> <span class="mname">${h(i.medicine_name)}</span> <span class="sub">${h(i.dose)} ${h(i.dose_unit)}</span></div>
   <span><button class="pill taken" onclick="mark(${i.schedule_id},'${i.plan_time}','taken')">服了</button>
   <button class="pill skip" onclick="mark(${i.schedule_id},'${i.plan_time}','skipped')">跳过</button></span></div>`).join('')
  :'<div class="sub">今天没有用药安排</div>')+'</div>';
}
async function mark(sid,time,st){await api('/intake',{method:'POST',body:JSON.stringify({schedule_id:sid,plan_time:time,status:st})});renderToday();renderMeds();}
async function renderMeds(){
  const meds=await api('/medicines');
  $('tab1').innerHTML=`<div class="card"><h1 style="font-size:16px">我的药品（${meds.length}）</h1>
  <button onclick="toggleMedForm()">＋ 扫码添加药品</button>
  <button style="margin-top:6px;background:#0f766e" onclick="rxPick()">📷 扫描处方入库</button>
  <input type="file" id="rx_file" accept="image/*" style="display:none" onchange="rxImport(this)">
  <div class="sub" id="rx_msg" style="margin-top:6px"></div>
  <div id="medform" style="display:none;margin-top:6px">
    <div class="row">
      <input id="mf_code" inputmode="numeric" placeholder="条码/本位码（8-14位数字）">
      <button style="flex:0 0 auto;width:auto" onclick="medScan()">📷 扫码</button>
      <button style="flex:0 0 auto;width:auto" onclick="medLookup()">查询填充</button>
    </div>
    <div class="sub" id="mf_msg" style="margin:-4px 0 8px">支持药盒 EAN-13 商品条码与药监局本位码（86 开头 14 位）。无摄像头权限时可直接手动输入后点「查询填充」。</div>
    <input id="mf_name" placeholder="药品名称 *">
    <input id="mf_spec" placeholder="规格（如 0.25g×24片）">
    <input id="mf_manu" placeholder="生产厂家（选填）">
    <input id="mf_appr" placeholder="批准文号 / 本位码（选填）">
    <div class="row">
      <input id="mf_stock" inputmode="decimal" placeholder="库存数量">
      <input id="mf_unit" placeholder="单位（盒）">
    </div>
    <div class="row">
      <input id="mf_dd" inputmode="decimal" placeholder="每日用量">
      <input id="mf_du" placeholder="剂量单位（片）">
    </div>
    <input id="mf_loc" placeholder="存放位置（如 客厅药箱）">
    <input id="mf_notes" placeholder="备注">
    <button onclick="saveMed()">保存药品</button>
  </div>`+
  (meds.length?meds.map(m=>`<div class="med"><div class="t">${h(m.name)} <span class="sub">${h(m.spec)} ${h(m.category)}</span></div>
  <div class="sub">余 ${h(m.stock_qty)} ${h(m.unit)} · 日用量 ${h(m.daily_dose)} ${h(m.dose_unit)} ${m.location?('· 存放：'+h(m.location)):''}</div>
  ${m.approval_no?`<div class="sub">批准文号：${h(m.approval_no)}${m.barcode?(' · 条码 '+h(m.barcode)):''}</div>`:''}
  ${m.refill&&m.refill.needRefill?`<div class="warn">库存仅够 ${m.refill.daysLeft} 天，${m.refill.nextRefillDate?h(m.refill.nextRefillDate)+' 前该开药了':'该开药了'}</div>`:(m.refill&&m.refill.nextRefillDate?`<div class="sub">预计 ${h(m.refill.nextRefillDate)} 需开药</div>`:'')}</div>`).join('')
  :'<div class="sub">暂无药品，点上方按钮扫码或手动添加</div>')+'</div>';
}
let medStream=null;
// 扫描/上传医生处方 → AI 识别全部药品规格数量 → 批量入库并按用法用量建提醒
function rxPick(){const f=$('rx_file');if(!f)return;f.value='';f.click();}
function rxFileToBase64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result||'').split(',')[1]||'');r.onerror=rej;r.readAsDataURL(file);});}
async function rxImport(inp){
  const file=inp.files&&inp.files[0];if(!file)return;
  const msg=$('rx_msg');msg.style.color='';msg.textContent='AI 识别处方中，请稍候…';
  try{
    const b64=await rxFileToBase64(file);
    const r=await api('/ai/recognize',{method:'POST',body:JSON.stringify({image:b64,type:'prescription'})});
    const meds=r.meds||[];
    if(!meds.length){msg.textContent='未识别到药品，请换一张更清晰的照片';return;}
    const lines=meds.map((m,i)=>`${i+1}. ${m.name}　规格 ${m.spec||'-'}　${m.pack_qty}${m.pack_unit}　用法 ${m.dose_per_time}${m.dose_unit}/次，每日 ${m.times_per_day} 次${m.duration_days?('，共'+m.duration_days+'天'):''}`).join('\n');
    if(!confirm('识别到 '+meds.length+' 种药品：\n\n'+lines+'\n\n确认全部入库并创建每日用药提醒？')){msg.textContent='已取消';return;}
    const res=await api('/prescriptions/import',{method:'POST',body:JSON.stringify({meds,create_schedule:true})});
    renderMeds();
    const m2=$('rx_msg');if(m2){m2.style.color='var(--ok)';m2.textContent='已入库 '+res.count+' 种药品，并已按用法用量创建每日提醒';}
  }catch(e){msg.textContent=e.message;msg.style.color='var(--bad)';}
}
function toggleMedForm(){const f=$('medform');f.style.display=f.style.display==='none'?'':'none';if(f.style.display==='none')stopScan();}
function medMsg(s){const e=$('mf_msg');if(e){e.textContent=s;e.style.color='';}}
function medErr(s){const e=$('mf_msg');if(e){e.textContent=s;e.style.color='var(--bad)';}}
async function medScan(){
  if(!('BarcodeDetector' in window)){medErr('当前浏览器不支持网页扫码（BarcodeDetector），请手动输入条码/本位码后点「查询填充」');return;}
  try{
    medStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
  }catch(e){medErr('无法打开摄像头：'+e.message+'（可手动输入条码）');return;}
  const ov=$('scanov');ov.style.display='flex';
  const v=$('scanvid');v.srcObject=medStream;try{await v.play();}catch(e){}
  let det;
  try{det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','codabar','itf']});}
  catch(e){det=new BarcodeDetector();}
  const timer=setInterval(async()=>{
    try{
      const codes=await det.detect(v);
      if(codes&&codes.length){
        const raw=String(codes[0].rawValue||'').replace(/\D/g,'');
        if(raw.length>=8&&raw.length<=14){stopScan();$('mf_code').value=raw;medLookup();}
      }
    }catch(e){}
  },400);
  ov.dataset.timer=timer;
}
function stopScan(){
  const ov=$('scanov');
  const t=+(ov&&ov.dataset.timer);if(t)clearInterval(t);if(ov)ov.dataset.timer='';
  if(medStream){medStream.getTracks().forEach(x=>x.stop());medStream=null;}
  if(ov)ov.style.display='none';
}
async function medLookup(){
  const code=($('mf_code').value||'').trim();
  if(!/^\d{8,14}$/.test(code)){medErr('请输入 8-14 位数字条码或本位码');return;}
  medMsg('查询中…');
  try{
    const r=await api('/medicine/barcode/'+code);
    const filled=[];
    const set=(id,v,tag)=>{if(v!==''&&v!=null&&$(id).value===''){$(id).value=v;filled.push(tag);}};
    if(r.found==='local'){
      const m=r.medicine;
      set('mf_name',m.name,'名称');set('mf_spec',m.spec,'规格');
      set('mf_manu',m.manufacturer,'厂家');set('mf_appr',m.approval_no,'批准文号');
      set('mf_stock',m.stock_qty!=null?String(m.stock_qty):'','库存');set('mf_unit',m.unit,'单位');
      set('mf_dd',m.daily_dose!=null?String(m.daily_dose):'','日用量');set('mf_du',m.dose_unit,'剂量单位');
      set('mf_loc',m.location,'存放位置');
      medMsg('已匹配家庭药箱记录：'+(filled.join('、')||'全部字段')+'（请核对）');
    }else if(r.found==='online'){
      const d=r.data;
      set('mf_name',d.name,'名称');set('mf_spec',d.spec,'规格');
      set('mf_manu',d.manufacturer,'厂家');set('mf_appr',d.approval_no,'批准文号');
      medMsg('药品库匹配：'+(filled.join('、')||d.raw_title||'')+'（请核对，未识别的字段可手动补充）');
    }else{
      medMsg('未查到该条码（'+(r.message||'各库均未收录')+'）。可手动填写信息，保存后全家扫码即可秒出');
    }
  }catch(e){medErr(e.message);}
}
async function saveMed(){
  const name=$('mf_name').value.trim();
  if(!name){medErr('药品名称必填');return;}
  const b={name,
    spec:$('mf_spec').value.trim(),
    stock_qty:+$('mf_stock').value||0,
    unit:$('mf_unit').value.trim()||'盒',
    daily_dose:+$('mf_dd').value||0,
    dose_unit:$('mf_du').value.trim()||'片',
    manufacturer:$('mf_manu').value.trim(),
    approval_no:$('mf_appr').value.trim(),
    barcode:($('mf_code').value||'').trim(),
    location:$('mf_loc').value.trim(),
    notes:$('mf_notes').value.trim()};
  try{
    await api('/medicines',{method:'POST',body:JSON.stringify(b)});
    ['mf_code','mf_name','mf_spec','mf_stock','mf_unit','mf_dd','mf_du','mf_manu','mf_appr','mf_loc','mf_notes'].forEach(id=>$(id).value='');
    $('medform').style.display='none';
    renderMeds();
  }catch(e){medErr(e.message);}
}
async function renderAlerts(){
  const a=await api('/alerts');
  $('tab2').innerHTML=`<div class="card"><h1 style="font-size:16px">开药提醒</h1>`+
  (a.refill.length?a.refill.map(x=>`<div class="item"><div><span class="mname">${h(x.name)}</span> <span class="sub">${h(x.owner)} · 剩 ${h(x.stock_qty)} ${h(x.unit)} · 日用 ${h(x.daily_dose)}</span></div><span class="warn">还能服 ${x.days_left} 天</span></div>`).join('')
  :'<div class="sub">暂无开药预警</div>')+`</div>
  <div class="card"><h1 style="font-size:16px">效期预警</h1>`+
  (a.expiry.length?a.expiry.map(x=>`<div class="item"><div><span class="mname">${h(x.name)}</span> <span class="sub">${h(x.owner)} · ${h(x.expiry_date)}</span></div>${x.expired?'<span class="bad">已过期</span>':`<span class="warn">${x.days_left}天</span>`}</div>`).join('')
  :'<div class="sub">暂无痛期预警</div>')+'</div>';
}
function tab(i,btn){document.querySelectorAll('.tabbar button').forEach(b=>b.classList.remove('act'));btn.classList.add('act');[0,1,2].forEach(k=>$('tab'+k).style.display=k===i?'':'none');}
if(T)init();
</script>
<div id="scanov" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:99;flex-direction:column;align-items:center;justify-content:center">
  <video id="scanvid" style="width:92%;max-width:480px;border-radius:12px;background:#000" playsinline muted></video>
  <div style="color:#fff;margin:14px 0;font-size:14px">对准药盒条码 / 本位码，识别后自动填充</div>
  <button style="width:auto;padding:10px 28px" onclick="stopScan()">关闭扫码</button>
</div>
</body>
</html>
